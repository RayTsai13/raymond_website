name: Build & Deploy

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Check static export
        run: |
          for f in index.html 404.html projects.html resume.html resume.pdf robots.txt sitemap.xml opengraph-image; do
            test -s "out/$f" || { echo "missing out/$f"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: out
          include-hidden-files: true

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy-production
    permissions:
      id-token: write # lets the job assume the AWS role via OIDC (no stored keys)
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: site
          path: out

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::676726973702:role/github-deploy-raymond-website
          aws-region: us-west-2

      - name: Deploy to S3 + CloudFront
        run: ./scripts/deploy.sh
