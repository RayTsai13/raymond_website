name: External links

# Internal links are checked on every build (scripts/check-export.mjs). External
# links break on their own schedule, so they're checked weekly instead of gating deploys.
on:
  schedule:
    - cron: "0 15 * * 1" # Mondays 15:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: "npm"

      - run: npm ci

      - run: npm run build

      # LinkedIn answers bots with 999, so it's excluded rather than reported as broken.
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --scheme https --scheme http
            --exclude "^https?://(www\.)?raymondtsai\.site"
            --exclude "linkedin\.com"
            --accept 200..=299,429
            "out/**/*.html"
          fail: true
